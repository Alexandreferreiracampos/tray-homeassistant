<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Configurar Home Tray</title><style>
*{box-sizing:border-box}body{margin:0;padding:26px;font:14px 'Segoe UI',sans-serif;background:#f4f6fa;color:#182237}h1{font-size:23px;margin:0 0 8px}p{color:#536078;margin:0 0 20px}label{display:block;margin-bottom:7px;font-weight:600}input{width:100%;padding:11px;border:1px solid #bac5d6;border-radius:7px;font:inherit}button{margin-top:15px;background:#245bd9;color:white;border:0;border-radius:7px;padding:10px 18px;cursor:pointer;font:inherit}#error{color:#b42318;font-size:12px;margin-top:8px}
</style></head><body><h1>Seu home, a um clique.</h1><p>Informe o IP e a porta da sua página.</p>
<form><label for="address">Endereço do home</label><input id="address" placeholder="192.168.1.100:8123" required autofocus><div id="error" role="alert"></div><button>Salvar e abrir</button></form>
<script>
const { ipcRenderer } = require('electron');
const field = document.querySelector('input');
ipcRenderer.invoke('get-address').then(value => { field.value = value; });
document.querySelector('form').addEventListener('submit', async event => {
  event.preventDefault();
  const result = await ipcRenderer.invoke('save-address', field.value);
  document.querySelector('#error').textContent = result.error || '';
});
</script></body></html>
