<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Configurar Home Tray</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:14px 'Segoe UI',sans-serif;background:#f4f6fa;color:#182237}h1{font-size:23px;margin:0 0 8px}p{color:#536078;margin:0 0 20px}label{display:block;margin-bottom:7px;font-weight:600}input:not([type=checkbox]){width:100%;padding:10px;border:1px solid #bac5d6;border-radius:7px;font:inherit}.sizes{display:flex;gap:16px;margin-top:18px}.sizes>div{flex:1;min-width:0}.check{margin-top:20px;display:flex;align-items:center;gap:8px}.hint{font-size:12px;margin:8px 0 16px;line-height:1.5}button{background:#245bd9;color:white;border:0;border-radius:7px;padding:11px 18px;cursor:pointer;font:inherit}#error{color:#b42318;font-size:12px;margin-bottom:12px}input:disabled{opacity:.55}
</style>
</head>
<body>
<h1>Configurar Home Tray</h1><p>Escolha o endereço e como abrir a janela.</p>
<form>
<label for="address">Endereço do home</label>
<input id="address" placeholder="192.168.1.100:8123" required autofocus>
<div class="sizes">
<div><label for="width">Largura (px)</label><input id="width" type="number" min="240" max="7680" step="1" value="720" required></div>
<div><label for="height">Altura (px)</label><input id="height" type="number" min="180" max="4320" step="1" value="480" required></div>
</div>
<label class="check"><input id="kiosk" type="checkbox">Modo kiosk — tela cheia no Windows</label>
<p class="hint">Em kiosk, o aplicativo ocupa a tela do monitor da bandeja. Esc retorna à janela. Largura e altura são usadas no modo janela e limitadas ao espaço disponível.</p>
<div id="error" role="alert"></div>
<button type="submit">Salvar e abrir</button>
</form>
<script>
const { ipcRenderer } = require('electron');
const address = document.getElementById('address');
const width = document.getElementById('width');
const height = document.getElementById('height');
const kiosk = document.getElementById('kiosk');
function updateFields() { width.disabled = height.disabled = kiosk.checked; }
kiosk.addEventListener('change', updateFields);
ipcRenderer.invoke('get-settings').then(settings => {
  if (!settings) return;
  address.value = settings.address;
  width.value = settings.width;
  height.value = settings.height;
  kiosk.checked = settings.kiosk;
  updateFields();
});
document.querySelector('form').addEventListener('submit', async event => {
  event.preventDefault();
  try {
    const result = await ipcRenderer.invoke('save-settings', {
      address: address.value, width: Number(width.value), height: Number(height.value), kiosk: kiosk.checked
    });
    document.getElementById('error').textContent = result.error || '';
  } catch { document.getElementById('error').textContent = 'Não foi possível salvar. Tente novamente.'; }
});
</script>
</body></html>
